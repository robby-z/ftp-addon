name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.info.outputs.description }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read App metadata
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./reolink_ftps
      - name: Verify release tag matches App version
        if: github.event_name == 'push'
        env:
          APP_VERSION: ${{ steps.info.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG}" = "v${APP_VERSION}"
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: reolink-ftps
          registry-prefix: ghcr.io/robby-z

  test:
    name: Unit and security tests
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.os }}
    needs: [prepare, test]
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./reolink_ftps
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Reolink FTPS Server
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=https://github.com/robby-z/ftp-addon
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish generic GHCR image
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: reolink-ftps
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/robby-z
